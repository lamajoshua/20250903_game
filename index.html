<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Let's ハエ叩き</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<link rel="stylesheet" href="css/style.css">
</head>

<body>
<main>
  <img class="c-logo" src="images/logo.svg" alt="Let's ハエ叩き">
  <section id="p-top">
    <label id="p-top__start-btn" class="c-btn">
      <span>START</span>
      <input type="checkbox" id="p-top__start-status">
    </label>
  </section>
  <section id="p-stage">
    
    <div class="c-stage__clear"><img src="images/clear.svg" alt="CLEAR"></div>
    
    <div class="c-stage">
      <label class="c-flying"><img src="images/fly.svg" alt=""><input type="checkbox" class="c-flying__status"></label>
      <label class="c-flying"><img src="images/fly.svg" alt=""><input type="checkbox" class="c-flying__status"></label>
      <label class="c-flying"><img src="images/fly.svg" alt=""><input type="checkbox" class="c-flying__status"></label>
    </div>
    
    <ul class="c-fly-list">
      <li>
        <img src="images/fly.svg" alt="ハエ" class="c-fly">
        <img src="images/kill-mark.svg" alt="ハエ" class="c-kill">
      </li>
      <li>
        <img src="images/fly.svg" alt="ハエ" class="c-fly">
        <img src="images/kill-mark.svg" alt="ハエ" class="c-kill">
      </li>
      <li>
        <img src="images/fly.svg" alt="ハエ" class="c-fly">
        <img src="images/kill-mark.svg" alt="ハエ" class="c-kill">
      </li>
    </ul>
  </section>
</main>
</body>
</html>
